# Render Blueprint: database + API + website in one go.
# Render dashboard → New → Blueprint → pick this repo.
# You'll be asked for the values marked `sync: false`.
databases:
  - name: voltcart-db
    plan: free
    databaseName: voltcart
    user: voltcart

services:
  - type: web
    name: voltcart-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: voltcart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEED_STORE
        value: "True"
      - key: CORS_ALLOWED_ORIGINS   # the website's address, e.g. https://voltcart-web.onrender.com
        sync: false
      - key: FRONTEND_URL           # same address; used for Stripe return links and emails
        sync: false
      - key: ADMIN_EMAIL            # your staff login
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY      # sk_test_... (optional; card payments are off without it)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET  # whsec_... (optional but recommended)
        sync: false

  - type: web
    name: voltcart-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Send every path to the React app so /shop and /orders/12 survive a refresh
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL           # e.g. https://voltcart-api.onrender.com/api
        sync: false
