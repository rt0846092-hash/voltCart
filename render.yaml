# Render Blueprint for the API. The database is on Neon and the website on Vercel.
# Render dashboard → New → Blueprint → pick this repo, then fill in the `sync: false` values.
services:
  - type: web
    name: voltcart-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL           # Neon connection string (direct, not pooled)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEED_STORE
        value: "True"
      - key: CORS_ALLOWED_ORIGINS   # the website's address, e.g. https://voltcart.vercel.app
        sync: false
      - key: FRONTEND_URL           # same address; used for Stripe return links and emails
        sync: false
      - key: ADMIN_EMAIL            # your staff login
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY      # sk_test_... (optional; card payments are off without it)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET  # whsec_... (optional but recommended)
        sync: false
